name: Source validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run public:check
      - run: npm run ledger:check
      - run: npm run test:unit
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

      # CI-only browser dependencies; no application dependency or lockfile change.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser acceptance tools
        timeout-minutes: 4
        run: |
          python -m pip --isolated install --disable-pip-version-check --index-url https://pypi.org/simple playwright==1.62.0
          python -m playwright install --with-deps chromium --only-shell
      - name: Mobile backup and learning acceptance
        timeout-minutes: 6
        run: python tests/browser/backup_learning.py
      - name: Keep synthetic browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .sites-runtime/browser-artifacts/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      # Deliberately no deployment, privileged secrets, or write-permission jobs.
